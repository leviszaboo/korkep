name: Collect diagnostics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Diagnostics lookback window in hours'
        required: false
        default: '24'

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/diagnostics/requirements.txt

      - name: Install diagnostics dependencies
        run: pip install -r tools/diagnostics/requirements.txt

      - name: Collect diagnostics
        working-directory: tools/diagnostics
        env:
          DIAGNOSTICS_STORAGE: postgres
          DIAGNOSTICS_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          NEON_PROJECT_IDS: ${{ secrets.NEON_PROJECT_IDS }}
          NEON_BRANCH_IDS: ${{ secrets.NEON_BRANCH_IDS }}
          CLOUD_RUN_LOG_LIMIT: ${{ vars.CLOUD_RUN_LOG_LIMIT || '20000' }}
        run: python diagnostics.py collect-once
